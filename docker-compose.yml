services:
  postgres:
    image: postgres:16-alpine
    container_name: notesapp-postgres
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d notesapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: notesapp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/notesapp"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      FRONTEND_URL: "${FRONTEND_URL}"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL}"
    container_name: notesapp-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
