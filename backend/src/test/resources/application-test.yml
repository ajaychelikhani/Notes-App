spring:
  datasource:
    url: jdbc:h2:mem:notesapp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

cors:
  allowed-origin: https://notes-app.vercel.app/, https://*.vercel.app, http://localhost:5173
